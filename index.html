<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Brew Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <style>
      input[type="range"] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #d97706;
        cursor: pointer;
        margin-top: -8px;
        box-shadow: 0 2px 6px rgba(217, 119, 6, 0.4);
        transition: all 0.2s;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: #e7e5e4;
        border-radius: 9999px;
      }
      .dark input[type="range"]::-webkit-slider-runnable-track {
        background: #44403c;
      }
      input[type="range"]:focus {
        outline: none;
      }
      input[type="range"]:focus::-webkit-slider-thumb {
        box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.2);
      }
      input[type="range"]:disabled::-webkit-slider-thumb {
        background: #a8a29e;
        cursor: not-allowed;
        box-shadow: none;
      }
      .dark input[type="range"]:disabled::-webkit-slider-thumb {
        background: #57534e;
      }
      input[type="range"]:disabled::-webkit-slider-runnable-track {
        background: #d6d3d1;
        cursor: not-allowed;
      }
      .dark input[type="range"]:disabled::-webkit-slider-runnable-track {
        background: #292524;
      }

      .time-dial::-webkit-outer-spin-button,
      .time-dial::-webkit-inner-spin-button {
        display: none;
        margin: 0;
      }
      .time-dial {
        -moz-appearance: textfield;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #d6d3d1;
        border-radius: 20px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #44403c;
      }

      #qrcode-target canvas,
      #qrcode-target img {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        display: block;
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-stone-100 to-amber-50 dark:from-stone-950 dark:to-stone-900 min-h-screen font-sans text-stone-800 dark:text-stone-200 antialiased p-2 sm:p-4 md:p-8 flex flex-col items-center justify-center transition-colors duration-300 relative overflow-x-hidden"
  >
    <button
      id="theme-toggle"
      class="absolute top-4 right-4 md:top-8 md:right-8 p-3 rounded-full bg-white/80 dark:bg-stone-800/80 backdrop-blur-md shadow-sm border border-stone-200 dark:border-stone-700 text-stone-600 dark:text-amber-500 hover:scale-105 transition-all z-50"
    >
      <svg
        id="theme-toggle-light-icon"
        class="hidden w-5 h-5"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
          fill-rule="evenodd"
          clip-rule="evenodd"
        ></path>
      </svg>
      <svg
        id="theme-toggle-dark-icon"
        class="hidden w-5 h-5"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
    </button>

    <div
      class="flex items-center gap-3 md:gap-4 mb-6 md:mb-8 drop-shadow-sm z-10 relative mt-12 md:mt-0"
    >
      <svg
        class="w-8 h-8 md:w-10 md:h-10 text-amber-700 dark:text-amber-500"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"
        ></path>
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 1v3M10 1v3M14 1v3"
        ></path>
      </svg>
      <h1
        class="text-2xl md:text-4xl font-black text-stone-900 dark:text-stone-50 tracking-tight"
      >
        Smart Brew Assistant
      </h1>
    </div>

    <div
      class="w-full max-w-5xl bg-white/90 dark:bg-stone-900/90 backdrop-blur-xl rounded-2xl md:rounded-3xl shadow-2xl shadow-amber-900/10 dark:shadow-black/50 overflow-hidden flex flex-col md:flex-row border border-white dark:border-stone-800 z-10 relative transition-colors duration-300"
    >
      <!-- Left Panel -->
      <div
        class="w-full md:w-5/12 bg-stone-50/60 dark:bg-stone-950/60 p-4 sm:p-6 lg:p-10 border-b md:border-b-0 md:border-r border-stone-100 dark:border-stone-800 h-auto md:h-[80vh] overflow-y-visible md:overflow-y-auto transition-colors duration-300"
      >
        <div class="mb-4 flex justify-between items-start">
          <div>
            <span
              id="creator-badge"
              class="inline-block py-1 px-3 rounded-full bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 text-[10px] md:text-xs font-bold tracking-wider mb-2 uppercase border border-amber-200 dark:border-amber-800"
            >
              Initializing...
            </span>
            <h2
              class="text-xl md:text-2xl font-extrabold text-stone-900 dark:text-stone-50 tracking-tight"
            >
              Brew Setup
            </h2>
          </div>

          <div class="relative">
            <button
              id="import-menu-btn"
              class="cursor-pointer bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 shadow-sm text-stone-600 dark:text-stone-300 hover:text-amber-700 dark:hover:text-amber-400 hover:border-amber-300 dark:hover:border-amber-600 text-xs font-bold py-2 px-3 rounded-lg transition-all flex items-center gap-1 shrink-0"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                ></path>
              </svg>
              <span class="hidden sm:inline">Import</span>
            </button>

            <div
              id="import-menu-dropdown"
              class="absolute right-0 mt-2 w-48 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl shadow-2xl hidden flex-col z-[70] overflow-hidden"
            >
              <label
                class="cursor-pointer px-4 py-3 text-sm font-bold text-stone-700 dark:text-stone-200 hover:bg-stone-50 dark:hover:bg-stone-700 transition-colors border-b border-stone-100 dark:border-stone-700 flex items-center gap-2"
              >
                <svg
                  class="w-4 h-4 text-amber-600"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                  ></path>
                </svg>
                Load .YAML
                <input
                  type="file"
                  id="load-config-file"
                  accept=".yaml,.yml"
                  class="hidden"
                />
              </label>
              <label
                class="cursor-pointer px-4 py-3 text-sm font-bold text-stone-700 dark:text-stone-200 hover:bg-stone-50 dark:hover:bg-stone-700 transition-colors flex items-center gap-2"
              >
                <svg
                  class="w-4 h-4 text-teal-600"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
                  ></path>
                </svg>
                Scan QR Code
                <input
                  type="file"
                  id="load-qr-file"
                  accept="image/*"
                  class="hidden"
                />
              </label>
            </div>
          </div>
        </div>

        <div
          class="flex bg-stone-200/60 dark:bg-stone-800/60 p-1 rounded-xl mb-6 border border-stone-300/50 dark:border-stone-700/50 shadow-inner"
        >
          <button
            id="mode-official"
            class="flex-1 py-2 text-[10px] md:text-xs font-bold rounded-lg bg-white dark:bg-stone-700 shadow-sm text-amber-700 dark:text-amber-400 transition-all"
          >
            Official Directory
          </button>
          <button
            id="mode-create"
            class="flex-1 py-2 text-[10px] md:text-xs font-bold rounded-lg text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 transition-all"
          >
            🛠️ Builder
          </button>
        </div>

        <div class="space-y-4 md:space-y-5">
          <div id="barista-container">
            <label
              id="barista-label"
              class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
              for="barista"
              >Select Recipe</label
            >
            <select
              id="barista"
              class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 transition-all shadow-sm appearance-none"
            >
              <option>Loading configs...</option>
            </select>
          </div>

          <div id="method-container">
            <label
              class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
              for="method"
              >Brew Method</label
            >
            <div class="relative w-full custom-dropdown" id="method-wrapper">
              <button
                type="button"
                class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 transition-all shadow-sm flex justify-between items-center text-left dropdown-toggle disabled:opacity-50 disabled:cursor-not-allowed"
                disabled
                id="method-btn"
              >
                <span class="selected-text truncate">Loading...</span>
                <svg
                  class="w-4 h-4 text-stone-400 shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </button>
              <div
                class="absolute z-[60] w-full mt-2 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl shadow-2xl hidden flex-col dropdown-menu overflow-hidden"
              >
                <div
                  class="p-2 border-b border-stone-100 dark:border-stone-700 bg-stone-50 dark:bg-stone-900/50"
                >
                  <input
                    type="text"
                    class="w-full bg-white dark:bg-stone-950 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-300 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm search-input"
                    placeholder="Search methods..."
                  />
                </div>
                <div
                  class="max-h-60 overflow-y-auto p-1 option-list custom-scrollbar"
                ></div>
              </div>
              <input type="hidden" id="method" value="" />
            </div>
          </div>

          <div id="universal-controls" class="space-y-4 md:space-y-5">
            <div class="grid grid-cols-2 gap-3 md:gap-4">
              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  for="roast"
                  >Roast</label
                >
                <select
                  id="roast"
                  class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 shadow-sm appearance-none"
                >
                  <option value="very_light">Very Light</option>
                  <option value="light">Light</option>
                  <option value="medium_light" selected>Medium Light</option>
                  <option value="medium">Medium</option>
                  <option value="medium_dark">Medium Dark</option>
                  <option value="dark">Dark</option>
                  <option value="very_dark">Very Dark</option>
                </select>
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  for="fermentation"
                  >Process</label
                >
                <div
                  class="relative w-full custom-dropdown"
                  id="fermentation-wrapper"
                >
                  <button
                    type="button"
                    class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 transition-all shadow-sm flex justify-between items-center text-left dropdown-toggle"
                  >
                    <span class="selected-text truncate">Washed</span>
                    <svg
                      class="w-4 h-4 text-stone-400 shrink-0"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 9l-7 7-7-7"
                      ></path>
                    </svg>
                  </button>
                  <div
                    class="absolute z-[60] w-full mt-2 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl shadow-2xl hidden flex-col dropdown-menu overflow-hidden"
                  >
                    <div
                      class="p-2 border-b border-stone-100 dark:border-stone-700 bg-stone-50 dark:bg-stone-900/50"
                    >
                      <input
                        type="text"
                        class="w-full bg-white dark:bg-stone-950 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-300 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm search-input"
                        placeholder="Search processes..."
                      />
                    </div>
                    <div
                      class="max-h-60 overflow-y-auto p-1 option-list custom-scrollbar"
                    ></div>
                  </div>
                  <input type="hidden" id="fermentation" value="washed" />
                </div>
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                for="weight"
                >Coffee Dose (g)</label
              >
              <input
                type="number"
                id="weight"
                value="15"
                min="10"
                max="50"
                class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-3 px-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 shadow-sm"
              />
            </div>

            <div class="pt-2">
              <div class="flex justify-between items-center mb-2">
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider"
                  for="ratio"
                  >Water Ratio</label
                >
                <span
                  id="ratio-lock-icon"
                  class="text-xs text-stone-400 dark:text-stone-500 font-medium"
                  >🔒 Locked</span
                >
                <span
                  class="text-sm font-bold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border border-amber-100 dark:border-amber-800 px-2 py-1 rounded-md"
                  >1:<span id="ratio-display">17</span></span
                >
              </div>
              <input
                type="range"
                id="ratio"
                min="10"
                max="25"
                step="0.5"
                value="17"
                class="w-full mt-2 md:mt-4"
                disabled
              />
            </div>
          </div>

          <div
            id="custom-builder"
            class="hidden mt-2 pt-2 space-y-4 md:space-y-5 border-t border-stone-200 dark:border-stone-700"
          >
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  >Config Name</label
                >
                <input
                  type="text"
                  id="custom-name"
                  placeholder="Morning Brew"
                  class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:ring-2 focus:ring-amber-600 text-sm"
                />
              </div>

              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  >Brewing Tool</label
                >
                <div
                  class="relative w-full custom-dropdown"
                  id="custom-brew-method-wrapper"
                >
                  <button
                    type="button"
                    class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-600 text-sm shadow-sm flex justify-between items-center text-left dropdown-toggle"
                  >
                    <span class="selected-text truncate">Hario V60</span>
                    <svg
                      class="w-4 h-4 text-stone-400 shrink-0"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 9l-7 7-7-7"
                      ></path>
                    </svg>
                  </button>
                  <div
                    class="absolute z-[60] w-full mt-2 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl shadow-2xl hidden flex-col dropdown-menu overflow-hidden"
                  >
                    <div
                      class="p-2 border-b border-stone-100 dark:border-stone-700 bg-stone-50 dark:bg-stone-900/50"
                    >
                      <input
                        type="text"
                        class="w-full bg-white dark:bg-stone-950 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-300 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm search-input"
                        placeholder="Search brewers..."
                      />
                    </div>
                    <div
                      class="max-h-60 overflow-y-auto p-1 option-list custom-scrollbar"
                    ></div>
                  </div>
                  <input type="hidden" id="custom-brew-method" value="v60" />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  >Grinder Name</label
                >
                <input
                  type="text"
                  id="custom-grinder-name"
                  placeholder="e.g., Timemore C2s"
                  class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:ring-2 focus:ring-amber-600 text-sm"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                  >Grind Size</label
                >
                <input
                  type="number"
                  id="custom-grinder-size"
                  placeholder="e.g., 20"
                  class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:ring-2 focus:ring-amber-600 text-sm"
                />
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                >Expected Profile</label
              >
              <input
                type="text"
                id="custom-profile"
                placeholder="e.g., Syrupy body, high clarity..."
                class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:ring-2 focus:ring-amber-600 text-sm"
              />
            </div>

            <div>
              <label
                class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
                >Brew Notes</label
              >
              <textarea
                id="custom-notes"
                rows="2"
                placeholder="e.g., Swirl aggressively during the bloom..."
                class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 py-2.5 px-3 rounded-lg focus:ring-2 focus:ring-amber-600 text-sm resize-none shadow-sm"
              ></textarea>
            </div>

            <div>
              <div class="flex justify-between items-center mb-2">
                <label
                  class="block text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider"
                  >Pour Steps</label
                >
                <button
                  id="preview-timeline-btn"
                  class="md:hidden text-[10px] font-bold text-teal-700 dark:text-teal-400 bg-teal-50 dark:bg-teal-900/30 hover:bg-teal-100 dark:hover:bg-teal-900/50 py-1.5 px-3 rounded-md border border-teal-200 dark:border-teal-800 transition-colors flex items-center gap-1 shadow-sm"
                >
                  <svg
                    class="w-3.5 h-3.5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    ></path>
                  </svg>

                </button>
              </div>

              <div id="custom-steps-container" class="space-y-3 mb-3"></div>

              <div class="flex flex-col sm:flex-row gap-2 mt-4">
                <button
                  id="add-step-btn"
                  class="w-full sm:w-1/2 py-2.5 bg-amber-50 dark:bg-amber-900/20 text-amber-700 dark:text-amber-400 text-sm font-bold rounded-lg border border-amber-200 dark:border-amber-800 hover:bg-amber-100 dark:hover:bg-amber-900/40 transition-colors"
                >
                  + Add Step
                </button>
                <button
                  id="stage-method-btn"
                  class="w-full sm:w-1/2 py-2.5 bg-teal-50 dark:bg-teal-900/20 text-teal-700 dark:text-teal-400 text-sm font-bold rounded-lg border border-teal-200 dark:border-teal-800 hover:bg-teal-100 dark:hover:bg-teal-900/40 transition-colors"
                >
                  ✓ Stage Method
                </button>
              </div>
            </div>

            <div
              id="staged-methods-container"
              class="hidden mt-2 p-3 bg-stone-50 dark:bg-stone-950 border border-stone-200 dark:border-stone-800 rounded-lg"
            >
              <p
                class="text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2"
              >
                Bundled in Config:
              </p>
              <div id="staged-methods-list" class="flex flex-wrap gap-2"></div>
            </div>

            <div
              class="pt-4 mt-4 border-t border-stone-200 dark:border-stone-700 flex flex-col sm:flex-row gap-2"
            >
              <button
                id="download-config-btn"
                class="w-full sm:w-1/2 py-3 bg-stone-200 hover:bg-stone-300 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 text-xs font-bold rounded-xl transition-all shadow-sm flex justify-center items-center gap-1.5"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                  ></path>
                </svg>
                Export .yaml
              </button>
              <button
                id="share-qr-btn"
                class="w-full sm:w-1/2 py-3 bg-amber-600 hover:bg-amber-700 dark:bg-amber-700 dark:hover:bg-amber-600 text-white text-xs font-bold rounded-xl transition-all shadow-md flex justify-center items-center gap-1.5"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
                  ></path>
                </svg>
                Share / Save QR
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel: Outputs -->
      <div
        class="w-full md:w-7/12 p-5 sm:p-6 lg:p-12 h-auto md:h-[80vh] overflow-y-auto transition-colors duration-300"
      >
        <div class="flex justify-between items-center mb-5 md:mb-6">
          <h2
            class="text-xl md:text-2xl font-extrabold text-stone-900 dark:text-stone-50 tracking-tight"
          >
            Extraction Profile
          </h2>
          <button
            id="quick-share-qr-btn"
            class="p-2 text-stone-500 hover:text-amber-700 dark:hover:text-amber-400 bg-stone-100 dark:bg-stone-800 rounded-lg transition-colors border border-stone-200 dark:border-stone-700 flex items-center gap-1 text-xs font-bold"
            title="Share current recipe as QR"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"
              ></path>
            </svg>
            <span class="hidden sm:inline">Share QR</span>
          </button>
        </div>

        <div
          id="metrics-container"
          class="grid grid-cols-2 gap-3 md:gap-4 mb-6 md:mb-8 transition-all"
        >
          <div
            class="bg-gradient-to-br from-amber-50 to-orange-50 dark:from-amber-900/30 dark:to-orange-900/30 border border-amber-100/50 dark:border-amber-800/50 p-4 md:p-5 rounded-xl md:rounded-2xl shadow-sm relative overflow-hidden"
          >
            <p
              class="text-[10px] md:text-xs font-bold text-orange-600 dark:text-orange-400 uppercase tracking-wider mb-1"
            >
              Target Yield
            </p>
            <p
              class="text-3xl md:text-4xl font-black text-amber-950 dark:text-amber-100"
            >
              <span id="target-water">255</span
              ><span
                class="text-xl md:text-2xl font-semibold text-amber-700 dark:text-amber-500 ml-1"
                >g</span
              >
            </p>
          </div>
          <div
            id="temp-card"
            class="bg-gradient-to-br from-red-50 to-rose-50 dark:from-red-900/30 dark:to-rose-900/30 border border-red-100/50 dark:border-red-800/50 p-4 md:p-5 rounded-xl md:rounded-2xl shadow-sm relative overflow-hidden transition-all flex flex-col justify-center"
          >
            <p
              class="text-[10px] md:text-xs font-bold text-red-600 dark:text-red-400 uppercase tracking-wider mb-1"
            >
              Brew Temp
            </p>
            <p
              class="text-3xl md:text-4xl font-black text-red-950 dark:text-red-100"
            >
              <span id="target-temp">92–96</span
              ><span
                class="text-xl md:text-2xl font-semibold text-red-700 dark:text-red-500 ml-1"
                >°C</span
              >
            </p>
          </div>
        </div>

        <div>
          <h3
            id="recipe-title"
            class="text-lg md:text-xl font-bold text-stone-900 dark:text-stone-50 inline-block"
          >
            Awaiting Configuration...
          </h3>

          <div
            id="recipe-grinder-badge"
            class="hidden mt-2 mb-1 flex items-center gap-1.5 px-2.5 py-1 w-max bg-stone-100 dark:bg-stone-800/80 border border-stone-200 dark:border-stone-700 rounded-md text-[11px] font-bold text-stone-600 dark:text-stone-300"
          >
            <svg
              class="w-3.5 h-3.5 text-amber-600 dark:text-amber-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
            </svg>
            <span id="recipe-grinder-text"></span>
          </div>

          <p
            id="recipe-profile"
            class="text-xs md:text-sm font-medium text-stone-500 dark:text-stone-400 mt-2 italic"
          ></p>
          <p
            id="recipe-notes"
            class="text-xs md:text-sm text-stone-600 dark:text-stone-300 mt-4 bg-stone-100 dark:bg-stone-800/50 p-3 md:p-4 rounded-lg border border-stone-200 dark:border-stone-700 hidden leading-relaxed"
          ></p>

          <div
            id="recipe-steps"
            class="relative border-l-2 border-amber-200 dark:border-amber-800/50 ml-2 md:ml-3 mt-6 space-y-6 md:space-y-7 pb-4"
          ></div>
        </div>
      </div>
    </div>

    <div
      class="mt-6 md:mt-8 mb-4 text-center flex items-center justify-center gap-2 md:gap-3 text-xs md:text-sm font-semibold text-stone-500/80 dark:text-stone-500 tracking-wide z-10 relative"
    >
      <span>&copy; 2026 Smart Brew Assistant&trade;</span>
      <span class="w-1 h-1 rounded-full bg-stone-400 dark:bg-stone-600"></span>
      <span>Crafted by Hritik Sharma</span>
    </div>

    <!-- BACKGROUND DECORATIONS -->
    <img
      src="images/coffee.png"
      alt="Coffee Graphic"
      class="hidden xl:block fixed bottom-[-20px] right-[25%] w-[22rem] opacity-20 dark:opacity-10 drop-shadow-2xl pointer-events-none z-0 transform -rotate-6 grayscale-[30%] dark:grayscale-[50%] mix-blend-multiply dark:mix-blend-screen"
    />
    <img
      src="images/1.png"
      alt="Decor Right"
      class="hidden xl:block fixed -bottom-8 -right-8 w-[24rem] opacity-30 dark:opacity-20 drop-shadow-2xl pointer-events-none z-0 transform rotate-12 grayscale-[30%] dark:grayscale-[50%] mix-blend-multiply dark:mix-blend-screen"
    />
    <img
      src="images/2.png"
      alt="Decor Left"
      class="hidden xl:block fixed -top-8 -left-8 w-[20rem] opacity-30 dark:opacity-20 drop-shadow-2xl pointer-events-none z-0 transform -rotate-12 grayscale-[30%] dark:grayscale-[50%] mix-blend-multiply dark:mix-blend-screen"
    />

    <!-- MOBILE PREVIEW MODAL -->
    <div
      id="recipe-preview-modal"
      class="hidden fixed inset-0 z-[100] bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white dark:bg-stone-900 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] transform scale-95 transition-transform duration-300"
      >
        <div
          class="p-4 border-b border-stone-200 dark:border-stone-800 flex justify-between items-center bg-stone-50 dark:bg-stone-950"
        >
          <h3
            class="font-bold text-stone-800 dark:text-stone-100 flex items-center gap-2"
          >
            <svg
              class="w-5 h-5 text-amber-600 dark:text-amber-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              ></path>
            </svg>
            Recipe Preview
          </h3>
          <button
            id="close-preview-btn"
            class="text-stone-400 hover:text-red-500 bg-white dark:bg-stone-800 rounded-full p-1 border border-stone-200 dark:border-stone-700 transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="p-6 overflow-y-auto" id="modal-content-area"></div>
      </div>
    </div>

    <!-- QR SHARE & DOWNLOAD MODAL -->
    <div
      id="qr-modal"
      class="hidden fixed inset-0 z-[110] bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"
    >
      <div
        class="bg-white dark:bg-stone-900 w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col p-6 items-center text-center border border-stone-100 dark:border-stone-800 transform scale-95 transition-transform duration-300"
      >
        <div class="w-full flex justify-between items-center mb-4">
          <span
            class="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-500"
            >Scan & Brew</span
          >
          <button
            id="close-qr-modal-btn"
            class="text-stone-400 hover:text-red-500 p-1"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <h3
          id="qr-modal-title"
          class="text-lg font-black text-stone-900 dark:text-stone-50 mb-1"
        >
          Morning Brew
        </h3>
        <p
          id="qr-modal-subtitle"
          class="text-xs text-stone-500 dark:text-stone-400 mb-5"
        ></p>

        <div
          class="p-4 bg-white rounded-2xl shadow-inner border border-stone-200 mb-5 flex items-center justify-center w-56 h-56 mx-auto"
        >
          <div
            id="qrcode-target"
            class="w-full h-full flex items-center justify-center"
          ></div>
        </div>

        <canvas id="qr-export-canvas" class="hidden"></canvas>

        <div class="w-full space-y-2">
          <button
            id="download-qr-card-btn"
            class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl transition-all shadow-md flex justify-center items-center gap-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
              ></path>
            </svg>
            Download QR Card (PNG)
          </button>
          <button
            id="copy-qr-link-btn"
            class="w-full py-2.5 bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 text-xs font-bold rounded-xl transition-all flex justify-center items-center gap-1.5"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
              ></path>
            </svg>
            <span id="copy-btn-text">Copy Direct Link</span>
          </button>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
