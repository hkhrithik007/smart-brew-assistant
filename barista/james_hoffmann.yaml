id: "james_hoffmann"
name: "James Hoffmann"
default_roast: "medium_light"
default_process: "washed"
default_dose: 15
methods:
  v60:
    label: "Pour Over (V60)"
    ratio: 16.6
    result_type: "Clean, sweet, and bright cup."
    steps:
      - time: "0:00"
        water: "{{chunk_1}}"
        text: 'Pour for the bloom. Give the brewer a gentle swirl to mix. <strong>Wait 45 seconds</strong>.'
      - time: "0:45"
        water: "{{chunk_2}}"
        text: 'Pour over 10 seconds. Pour in slow circles, keeping the kettle spout low. Wait until 1:10.'
      - time: "1:10"
        water: "{{chunk_3}}"
        text: 'Pour over 10 seconds. <strong>Wait 10 seconds</strong>.'
      - time: "1:30"
        water: "{{chunk_4}}"
        text: 'Pour over 10 seconds. <strong>Wait 10 seconds</strong>.'
      - time: "1:50"
        water: "{{water}}"
        text: 'Pour over 10 seconds.'
      - time: "2:00"
        water: ""
        text: 'Give the brewer a final gentle swirl. Let it draw down (should finish around 3:00).'
  french_press:
    label: "French Press"
    ratio: 16.6
    result_type: "Full body, sweet, with absolutely zero sludge."
    steps:
      - time: "0:00"
        water: "{{water}}"
        text: 'Pour all water. Do not put the plunger on yet.'
      - time: "4:00"
        water: ""
        text: 'Take a spoon and gently stir the crust at the top. Most grounds will fall to the bottom.'
      - time: "4:05"
        water: ""
        text: 'Scoop off any remaining foam and floating bits with two spoons and discard.'
      - time: "4:10"
        water: ""
        text: 'Wait patiently. Do absolutely nothing for at least 5 minutes to let the microscopic silt settle.'
      - time: "9:00+"
        water: ""
        text: 'Place the plunger on the surface as a strainer (<strong>do not plunge down</strong>). Pour gently into your cup and serve.'
  aeropress:
    label: "AeroPress"
    ratio: 18.1
    result_type: "High extraction, strong and clear cup."
    steps:
      - time: "0:00"
        water: "{{water}}"
        text: 'Standard orientation (not inverted). Put dry paper in cap, lock it. Pour all water.'
      - time: "0:15"
        water: ""
        text: 'Insert the plunger just slightly into the top chamber. This creates a vacuum and stops the coffee from dripping through.'
      - time: "2:00"
        water: ""
        text: 'Carefully hold the base and the plunger together, and give the AeroPress a gentle swirl.'
      - time: "2:30"
        water: ""
        text: 'Begin pressing down gently. It should take about 30 seconds to push all the way through.'
      - time: "3:00"
        water: ""
        text: 'Stop pressing when you hear the hiss. Pull back slightly on the plunger to stop drips, and serve.'
