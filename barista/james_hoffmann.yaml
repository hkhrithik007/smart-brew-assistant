id: "james_hoffmann"
name: "James Hoffmann"
default_roast: "medium_light"
default_process: "washed"
default_dose: 15
methods:
  v60:
    label: "Pour Over (V60)"
    ratio: 16.6
    grinder_name: "Timemore C2s"
    grind_size: 20
    result_type: "Clean, sweet, and bright cup."
    notes: "Based on the Ultimate 1-Cup V60 method. Use water just off the boil."
    steps:
      - time: "0:00"
        water: "{{chunk_1}}"
        text: "Pour {{chunk_1}}g of water to bloom. Gently swirl from 0:10 - 0:15."
      - time: "0:45"
        water: "{{chunk_2}}"
        text: "Pour up to {{chunk_2}}g total over 15 seconds. Pause until 1:10."
      - time: "1:10"
        water: "{{chunk_3}}"
        text: "Pour up to {{chunk_3}}g total over 10 seconds. Pause until 1:30."
      - time: "1:30"
        water: "{{chunk_4}}"
        text: "Pour up to {{chunk_4}}g total over 10 seconds. Pause until 1:50."
      - time: "1:50"
        water: "{{water}}"
        text: "Pour up to {{water}}g total over 10 seconds."
      - time: "2:00"
        water: ""
        text: "Give the brewer a final gentle swirl and let it draw down."
  french_press:
    label: "French Press"
    ratio: 15.0
    grinder_name: "Timemore C2s"
    grind_size: 24
    result_type: "Heavy body, rich and textured."
    notes: "James Hoffmann Ultimate French Press technique. Do not plunge all the way down."
    steps:
      - time: "0:00"
        water: "{{water}}"
        text: "Pour all {{water}}g of water. Wait 4 minutes."
      - time: "4:00"
        water: ""
        text: "Stir the crust. Scoop off the foam and floating bits. Wait 5 more minutes."
      - time: "9:00"
        water: ""
        text: "Plunge just to the surface of the coffee and pour gently."
  moka_pot:
    label: "Moka Pot"
    ratio: 10.0
    grinder_name: "Timemore C2s"
    grind_size: 15
    result_type: "Strong, espresso-like intensity."
    notes: "Fill base with boiling water. Start on medium-low heat."
    steps:
      - time: "0:00"
        water: ""
        text: "Assemble with boiling water in the base and place on medium-low heat."
      - time: "0:00"
        water: ""
        text: "When coffee starts flowing fast and bubbling lighter, remove from heat."
      - time: "0:00"
        water: ""
        text: "Run the base under cold water immediately to stop extraction."
